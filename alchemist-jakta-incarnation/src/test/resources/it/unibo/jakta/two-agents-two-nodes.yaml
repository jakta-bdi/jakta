variables:
  messaging: &messaging
    type: ArbitraryVariable
    parameters: [ global, [ global, neighborhood ] ]
  range: &range
    type: ArbitraryVariable
    parameters: [ 5, [ 5, 10 ] ]

network-model:
  type: ConnectWithinDistance
  parameters: [ *range ]

incarnation: jakta

# The two nodes are ~6.4 apart
deployments:
  - type: Point
    parameters: [ 2, 2 ]
    programs:
      - program:
          entrypoint: it.unibo.jakta.test.TwoAgentsTwoNodes.entrypointNodeOne
          messaging: *messaging

  - type: Point
    parameters: [ 6, 7 ]
    programs:
      - program:
          entrypoint: it.unibo.jakta.test.TwoAgentsTwoNodes.entrypointNodeTwo
          messaging: *messaging

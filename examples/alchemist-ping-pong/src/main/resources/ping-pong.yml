incarnation: jakta

seeds:
  scenario: 0
  simulation: 0

environment:
  type: Continuous2DEnvironment

# two devices are connected when they are closer than 5
network-model:
  type: ConnectWithinDistance
  parameters: [ 5 ]

deployments:
  - type: Point
    parameters: [ 0, 0 ]
    programs:
      - program: PingPong.aliceDevice
        time-distribution: 1
  - type: Point
    parameters: [ 3, 2 ]
    programs:
      - program: PingPong.bobDevice
        time-distribution: 1
